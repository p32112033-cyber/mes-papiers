<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes papiers</title>
<meta name="theme-color" content="#0F5C4D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Mise en page : une seule colonne large, gros boutons, une couleur par dossier pour se repérer sans lire. */
:root{
  --bg:#F4F5F1; --surface:#FFFFFF; --ink:#16211E; --muted:#4F5C58; --line:#C5CCC6;
  --accent:#0F5C4D; --on-accent:#FFFFFF; --danger:#A3261C; --focus:#B96A00;
  --f0:#D6E6F4; --f1:#F6E2BF; --f2:#DDEECF; --f3:#F2D6DB; --f4:#E2DAF1; --f5:#D1EBE6;
  --font:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101615; --surface:#192120; --ink:#EEF3F0; --muted:#A9B7B2; --line:#3A4946;
    --accent:#5FD0B5; --on-accent:#0B1F1B; --danger:#FF8E82; --focus:#FFB84D;
    --f0:#1F3547; --f1:#4A3B1D; --f2:#27401F; --f3:#4A252C; --f4:#352A50; --f5:#1D403B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101615; --surface:#192120; --ink:#EEF3F0; --muted:#A9B7B2; --line:#3A4946;
  --accent:#5FD0B5; --on-accent:#0B1F1B; --danger:#FF8E82; --focus:#FFB84D;
  --f0:#1F3547; --f1:#4A3B1D; --f2:#27401F; --f3:#4A252C; --f4:#352A50; --f5:#1D403B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font); font-size:20px; line-height:1.45;
  padding-block:20px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
#app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
h1{font-size:2rem;line-height:1.15;margin:0;text-wrap:balance;overflow-wrap:anywhere}
h2{font-size:1.4rem;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
.meta,.tc,.empty,.hint{color:var(--muted)}
.empty{padding:18px 4px}
button,.btn,.in{font:inherit}
button{cursor:pointer;color:inherit}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:62px;padding:10px 18px;
  border-radius:14px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);
  font-size:1.15rem;font-weight:700;text-align:center;text-decoration:none;
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.stack{display:flex;flex-direction:column;gap:12px}
.back{
  display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:56px;padding:6px 16px 6px 10px;
  background:none;border:2px solid var(--line);border-radius:14px;font-size:1.1rem;font-weight:700;color:var(--ink);
}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{
  min-height:140px;padding:16px;border-radius:18px;border:2px solid var(--line);text-align:left;color:var(--ink);
  display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-width:0;
}
.tn{font-size:1.3rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.tc{font-size:.95rem;color:var(--ink);opacity:.8}
.fh{padding:18px 16px;border-radius:18px;border:2px solid var(--line)}
.search{position:relative;display:block}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .in{padding-left:54px}
.in{
  width:100%;min-height:62px;padding:0 16px;font-size:1.2rem;color:var(--ink);background:var(--surface);
  border:2px solid var(--ink);border-radius:14px;
}
.sb{display:flex;flex-direction:column;gap:6px;font-weight:700}
.ta{padding:12px 16px;min-height:170px;font-family:inherit;line-height:1.4;resize:vertical}
.list{display:flex;flex-direction:column;gap:10px}
.row{
  display:flex;align-items:center;gap:14px;width:100%;min-height:88px;padding:10px;text-align:left;
  background:var(--surface);border:2px solid var(--line);border-radius:14px;min-width:0;
}
.row .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.row .rn{font-weight:700;font-size:1.15rem;overflow-wrap:anywhere}
.row .rs{font-size:.95rem;color:var(--muted)}
.th{width:68px;height:68px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.trow{display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--surface);border:2px solid var(--line);border-radius:14px}
.viewer{overflow:auto;border:2px solid var(--line);border-radius:14px;background:var(--surface);max-height:70vh}
.viewer img{display:block;width:100%;height:auto}
.viewer.zoom img{width:240%;max-width:none}
.viewer iframe{display:block;width:100%;height:65vh;border:0}
.warn{padding:14px 16px;border:2px solid var(--danger);border-radius:14px;color:var(--danger);font-weight:700}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.panel{
  width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--surface);color:var(--ink);
  border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:12px;padding-top:22px;
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(22px + env(safe-area-inset-bottom, 0px));
}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chip,.opt{
  min-height:58px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);
  font-weight:700;font-size:1.05rem;color:var(--ink);overflow-wrap:anywhere;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.on::before{content:"✓ "}
.toast{position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding-top:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.tin{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-weight:700}
.tb{min-height:48px;padding:0 16px;border-radius:10px;border:2px solid var(--bg);background:none;color:var(--bg);font-weight:700;font-size:1.05rem}
@media (prefers-reduced-motion:no-preference){.btn,.tile,.row{transition:transform .08s}.btn:active,.tile:active,.row:active{transform:scale(.98)}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="cam" accept="image/*" capture="environment" class="vh" tabindex="-1">
<input type="file" id="pick" class="vh" tabindex="-1">
<input type="file" id="imp" accept=".json,application/json" class="vh" tabindex="-1">

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = t => new Date(t).toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});

const I = {
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
  note:'<path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>'
};
const ic = (n, s = 26) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ---------- Stockage : IndexedDB dans ce navigateur ---------- */
let db = null, dl = null, folders = [], docs = [];
const openDB = () => new Promise((res, rej) => {
  try {
    const r = indexedDB.open('mes-papiers', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('folders', {keyPath:'id'}); r.result.createObjectStore('docs', {keyPath:'id'}); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  } catch (e) { rej(e); }
});
const tx = (store, mode, fn) => new Promise((res, rej) => {
  const t = db.transaction(store, mode); const r = fn(t.objectStore(store));
  t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
});
async function save(store, v) { try { if (db) await tx(store, 'readwrite', o => o.put(v)); } catch (e) { $('#warn') && ($('#warn').hidden = false); } }
async function drop(store, id) { try { if (db) await tx(store, 'readwrite', o => o.delete(id)); } catch (e) {} }

/* ---------- Données ---------- */
const urls = new Map();
const urlOf = d => { let u = urls.get(d.id); if (!u) { u = URL.createObjectURL(d.blob); urls.set(d.id, u); } return u; };
const isImg = d => (d.type || '').startsWith('image/');
const folderById = id => folders.find(f => f.id === id);
const liveFolders = () => folders.filter(f => !f.deleted);
let sort = 'new';
const sortDocs = l => l.sort(sort === 'old' ? (a, b) => a.created - b.created : sort === 'az' ? (a, b) => a.title.localeCompare(b.title, 'fr', {sensitivity:'base'}) : (a, b) => b.created - a.created);
const docsOf = id => sortDocs(docs.filter(d => d.folder === id && !d.deleted));
const allDocs = () => sortDocs(docs.filter(d => !d.deleted && folderById(d.folder) && !folderById(d.folder).deleted));
const trashDocs = () => docs.filter(d => d.deleted && folderById(d.folder) && !folderById(d.folder).deleted);
const trashFolders = () => folders.filter(f => f.deleted);
const trashCount = () => trashDocs().length + trashFolders().length;

/* ---------- Fenêtres de dialogue (sans alert/confirm) ---------- */
function sheet(html) {
  return new Promise(res => {
    const m = $('#modal');
    m.innerHTML = '<div class="panel" role="dialog" aria-modal="true">' + html + '</div>';
    m.hidden = false;
    const done = v => { m.hidden = true; m.innerHTML = ''; m.onclick = m.onkeydown = null; sheet.close = () => {}; res(v); };
    sheet.close = done;
    const val = () => { const i = m.querySelector('input.in'), c = m.querySelector('.chip.on'), ta = m.querySelector('textarea'); return {text: i ? i.value.trim() : '', folder: c ? c.dataset.f : null, area: ta ? ta.value : ''}; };
    m.onclick = e => {
      const c = e.target.closest('.chip');
      if (c) { m.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); return; }
      const b = e.target.closest('[data-r]');
      if (b) return done(b.dataset.r === 'ok' ? val() : b.dataset.r === 'no' ? null : b.dataset.r);
      if (e.target === m) done(null);
    };
    m.onkeydown = e => {
      if (e.key === 'Escape') return done(null);
      if (e.key === 'Enter' && e.target.matches('input.in')) return done(val());
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('label[for]')) { e.preventDefault(); document.getElementById(e.target.htmlFor).click(); }
    };
    const i = m.querySelector('input.in'); if (i) { i.focus(); i.select(); }
  });
}
sheet.close = () => {};
async function askText(title, value, okLabel) {
  const r = await sheet(`<h2>${esc(title)}</h2><input class="in" id="txt" value="${esc(value)}" aria-label="${esc(title)}" maxlength="80"><button class="btn primary" data-r="ok">${esc(okLabel || 'Valider')}</button><button class="btn" data-r="no">Annuler</button>`);
  return r && r.text ? r.text : null;
}
const askYes = (title, text, yes) => sheet(`<h2>${esc(title)}</h2><p>${esc(text)}</p><button class="btn danger" data-r="yes">${esc(yes)}</button><button class="btn" data-r="no">Non, garder</button>`).then(r => r === 'yes');

let tt;
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<div class="tin" role="status"><span>${esc(msg)}</span>${undo ? '<button class="tb" data-act="undo">Annuler</button>' : ''}</div>`;
  t._u = undo || null; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 7000);
}

/* ---------- Affichage ---------- */
let view = {n:'home'}, q = '';
const app = $('#app');
const go = v => { view = v; render(); window.scrollTo(0, 0); };

const sortBar = () => `<label class="sb">Trier par <select id="sort" class="in">${[['new','Les plus récents'],['old','Les plus anciens'],['az','Nom, de A à Z']].map(([v, l]) => `<option value="${v}"${sort === v ? ' selected' : ''}>${l}</option>`).join('')}</select></label>`;
const tile = f => {
  const n = docsOf(f.id).length;
  return `<button class="tile" style="background:var(--f${f.c % 6})" data-act="open" data-id="${f.id}">${ic('folder', 34)}<span class="tn">${esc(f.name)}</span><span class="tc">${n ? n + ' document' + (n > 1 ? 's' : '') : 'Aucun document'}</span></button>`;
};
const thumb = d => isImg(d) ? `<img class="th" src="${urlOf(d)}" alt="">` : `<span class="th">${ic(d.type === 'note' ? 'note' : 'file', 30)}</span>`;
const docRow = (d, withFolder) => `<button class="row" data-act="doc" data-id="${d.id}">${thumb(d)}<span class="tx"><span class="rn">${esc(d.title)}</span><span class="rs">${d.type === 'note' ? 'Note · ' : ''}${fmt(d.created)}${withFolder && folderById(d.folder) ? ' · ' + esc(folderById(d.folder).name) : ''}</span></span></button>`;

function homeBody() {
  const b = $('#home-body'), t = norm(q.trim());
  if (t) {
    const r = allDocs().filter(d => norm(d.title).includes(t) || norm(folderById(d.folder).name).includes(t) || norm(d.text || '').includes(t));
    b.innerHTML = r.length ? sortBar() + `<div class="list">${r.map(d => docRow(d, true)).join('')}</div>` : `<p class="empty">Aucun document trouvé pour « ${esc(q)} ».</p>`;
    return;
  }
  const n = trashCount();
  b.innerHTML = `<h2>Mes dossiers</h2><div class="tiles">${liveFolders().map(tile).join('')}</div>
    <div class="stack"><button class="btn" data-act="all">Tous mes documents</button><button class="btn" data-act="newfolder">${ic('plus')} Nouveau dossier</button>
    <button class="btn" data-act="trash">Corbeille${n ? ' (' + n + ')' : ''}</button>
    <button class="btn" data-act="backup">Sauvegarde</button></div>`;
}

function render() {
  if (view.n === 'home') {
    app.innerHTML = `<div id="warn" class="warn" hidden>Attention : ce navigateur n'enregistre pas les documents. Ils seront perdus à la fermeture.</div>
      <h1>Mes papiers</h1>
      <button class="btn primary" data-act="add">${ic('cam')} Ajouter un document</button>
      <label class="search">${ic('search')}<input id="q" class="in" type="search" placeholder="Chercher un document" value="${esc(q)}" aria-label="Chercher un document"></label>
      <div id="home-body" class="stack"></div>`;
    homeBody();
    if (!db && db !== undefined && window.__dbFailed) $('#warn').hidden = false;
  } else if (view.n === 'folder') {
    const f = folderById(view.id); if (!f || f.deleted) return go({n:'home'});
    const l = docsOf(f.id);
    app.innerHTML = `<button class="back" data-act="home">${ic('back')} Mes dossiers</button>
      <h1 class="fh" style="background:var(--f${f.c % 6})">${esc(f.name)}</h1>
      <button class="btn primary" data-act="add" data-id="${f.id}">${ic('cam')} Ajouter un document ici</button>
      ${l.length ? (l.length > 1 ? sortBar() : '') + `<div class="list">${l.map(d => docRow(d)).join('')}</div>` : '<p class="empty">Ce dossier est vide. Touchez « Ajouter un document ici » pour commencer.</p>'}
      <div class="stack"><button class="btn" data-act="renamefolder" data-id="${f.id}">Changer le nom du dossier</button>
      <button class="btn danger" data-act="delfolder" data-id="${f.id}">Supprimer le dossier</button></div>`;
  } else if (view.n === 'doc') {
    const d = docs.find(x => x.id === view.id); if (!d || d.deleted) return go({n:'home'});
    const f = folderById(d.folder);
    app.innerHTML = `<button class="back" data-act="folder" data-id="${d.folder}">${ic('back')} ${esc(f ? f.name : 'Retour')}</button>
      <h1>${esc(d.title)}</h1><p class="meta">Ajouté le ${fmt(d.created)}</p>
      ${viewerHtml(d)}
      ${isImg(d) ? '<button class="btn" data-act="zoom" id="zoom">Agrandir</button>' : ''}
      <div class="stack">${d.type === 'note' ? `<button class="btn primary" data-act="editnote" data-id="${d.id}">Modifier la note</button>` : (dl ? `<button class="btn" data-act="export" data-id="${d.id}">Enregistrer sur l'appareil</button>` : '')}<button class="btn" data-act="renamedoc" data-id="${d.id}">Changer le nom</button>
      <button class="btn" data-act="movedoc" data-id="${d.id}">Changer de dossier</button>
      <button class="btn danger" data-act="deldoc" data-id="${d.id}">Supprimer ce document</button></div>`;
  } else if (view.n === 'all') {
    const l = allDocs();
    app.innerHTML = `<button class="back" data-act="home">${ic('back')} Mes dossiers</button><h1>Tous mes documents</h1>
      <button class="btn primary" data-act="add">${ic('cam')} Ajouter un document</button>
      ${l.length ? (l.length > 1 ? sortBar() : '') + `<div class="list">${l.map(d => docRow(d, true)).join('')}</div>` : '<p class="empty">Aucun document pour l\'instant.</p>'}`;
  } else if (view.n === 'trash') {
    const tf = trashFolders(), td = trashDocs();
    app.innerHTML = `<button class="back" data-act="home">${ic('back')} Mes dossiers</button><h1>Corbeille</h1>
      <p class="hint">Rien n'est perdu tant que vous ne touchez pas « Supprimer pour toujours ».</p>
      ${tf.length + td.length ? '' : '<p class="empty">La corbeille est vide.</p>'}
      ${tf.map(f => `<div class="trow"><strong>Dossier : ${esc(f.name)}</strong><span class="meta">${docs.filter(d => d.folder === f.id).length} document(s) dedans</span><button class="btn primary" data-act="restorefolder" data-id="${f.id}">Remettre ce dossier</button><button class="btn danger" data-act="purgefolder" data-id="${f.id}">Supprimer pour toujours</button></div>`).join('')}
      ${td.map(d => `<div class="trow"><strong>${esc(d.title)}</strong><span class="meta">Dossier : ${esc(folderById(d.folder).name)}</span><button class="btn primary" data-act="restoredoc" data-id="${d.id}">Remettre ce document</button><button class="btn danger" data-act="purgedoc" data-id="${d.id}">Supprimer pour toujours</button></div>`).join('')}
      ${tf.length + td.length ? '<button class="btn danger" data-act="emptytrash">Vider la corbeille</button>' : ''}`;
  }
}

/* ---------- Ajouter un document ---------- */
let pendingFolder = null;
function addFlow(id) {
  if (!liveFolders().length) return toast('Créez d\'abord un dossier.');
  pendingFolder = id || null;
  sheet(`<h2>Ajouter un document</h2>
    <label class="btn primary" for="cam" tabindex="0">${ic('cam')} Prendre une photo</label>
    <label class="btn" for="pick" tabindex="0">${ic('file')} Choisir un fichier</label>
    <button class="btn" data-act="newnote">${ic('note')} Écrire une note</button>
    <button class="btn" data-r="no">Annuler</button>`);
}
const viewerHtml = d => d.type === 'note' ? `<div class="viewer" id="viewer"><p style="padding:16px;white-space:pre-wrap;overflow-wrap:anywhere">${esc(d.text || 'Note vide.')}</p></div>`
  : isImg(d) ? `<div class="viewer" id="viewer"><img src="${urlOf(d)}" alt="${esc(d.title)}"></div>`
  : d.type === 'application/pdf' ? `<div class="viewer" id="viewer"><iframe src="${urlOf(d)}" title="${esc(d.title)}"></iframe></div>`
  : `<div class="trow"><strong>${esc(d.name || d.title)}</strong><span class="meta">Ce type de fichier ne s'affiche pas ici.</span></div>`;

async function noteFlow(d, pre) {
  const f0 = d ? d.folder : (pendingFolder || (view.n === 'folder' ? view.id : liveFolders()[0].id));
  const r = await sheet(`<h2>${d ? 'Modifier la note' : 'Nouvelle note'}</h2>
    <label for="t">Titre</label><input id="t" class="in" value="${esc(d ? d.title : '')}" maxlength="80">
    <label for="n">Texte</label><textarea id="n" class="in ta" rows="8">${esc(d ? d.text || '' : pre || '')}</textarea>
    ${d ? '' : `<p>Dans quel dossier ?</p><div class="chips">${liveFolders().map(f => `<button class="chip${f.id === f0 ? ' on' : ''}" data-f="${f.id}">${esc(f.name)}</button>`).join('')}</div>`}
    <button class="btn primary" data-r="ok">Enregistrer</button><button class="btn" data-r="no">Annuler</button>`);
  if (!r) return;
  if (d) { d.title = r.text || d.title; d.text = r.area; await save('docs', d); toast('Note enregistrée'); render(); return; }
  if (!r.text && !r.area.trim()) return;
  const n = {id:uid(), folder:r.folder || f0, title:r.text || r.area.trim().split('\n')[0].slice(0, 40), created:Date.now(), type:'note', text:r.area, deleted:0};
  docs.push(n); await save('docs', n); toast('Note enregistrée'); go({n:'folder', id:n.folder});
}

async function exportDoc(d) {
  const ext = {'image/jpeg':'jpg', 'image/png':'png', 'image/webp':'webp', 'application/pdf':'pdf'}[d.type];
  try { await dl.save({filename: d.name || d.title + (ext ? '.' + ext : ''), data: d.blob}); toast('Document enregistré'); }
  catch (e) { if (!e || e.code !== 'declined') toast('Ce fichier ne peut pas être enregistré ici.'); }
}

async function details(file, src) {
  const f0 = pendingFolder || (view.n === 'folder' ? view.id : liveFolders()[0].id);
  const base = src === 'pick' ? file.name.replace(/\.[^.]+$/, '') : 'Document du ' + fmt(Date.now());
  const r = await sheet(`<h2>Enregistrer le document</h2>
    <label for="t">Nom du document</label><input id="t" class="in" value="${esc(base)}" maxlength="80">
    <p>Dans quel dossier ?</p>
    <div class="chips">${liveFolders().map(f => `<button class="chip${f.id === f0 ? ' on' : ''}" data-f="${f.id}">${esc(f.name)}</button>`).join('')}</div>
    <button class="btn primary" data-r="ok">Enregistrer</button><button class="btn" data-r="no">Annuler</button>`);
  if (!r) return;
  const d = {id:uid(), folder:r.folder || f0, title:r.text || base, created:Date.now(), type:file.type || 'application/octet-stream', name:file.name, blob:file, deleted:0};
  docs.push(d); await save('docs', d);
  toast('Document enregistré'); go({n:'folder', id:d.folder});
}
for (const id of ['cam', 'pick']) $('#' + id).onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return; sheet.close(null); details(f, id);
};

/* ---------- Sauvegarde ---------- */
const toData = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function fromData(u) {
  const [h, b] = u.split(','); const bin = atob(b); const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], {type: (h.match(/:(.*?);/) || [])[1] || ''});
}
async function browserSave({filename, data}) {
  const b = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith('.json') ? 'application/json' : 'application/octet-stream'});
  const u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 10000);
  return {status:'saved'};
}

/* Documents reçus par « Partager » : le service worker les met de côté, on les range ici un par un. */
async function handleShare() {
  if (!/[?&]share=1/.test(location.search) || !window.caches) return;
  history.replaceState(null, '', location.pathname);
  pendingFolder = null;
  try {
    const c = await caches.open('share');
    for (const k of await c.keys()) {
      const r = await c.match(k); if (!r) continue;
      const name = decodeURIComponent(r.headers.get('X-Name') || 'Document'), kind = r.headers.get('X-Kind');
      const b = await r.blob(); await c.delete(k);
      if (!liveFolders().length) { toast('Créez d\'abord un dossier.'); return; }
      if (kind === 'note') await noteFlow(null, await b.text());
      else await details(new File([b], name, {type: b.type}), 'pick');
    }
  } catch (e) { toast('Le partage n\'a pas pu être lu.'); }
}

async function backup() {
  const r = await sheet(`<h2>Sauvegarde</h2>
    <p>Les documents sont gardés dans ce navigateur, sur cet appareil. Une copie permet de tout retrouver si l'appareil change ou si les données du navigateur sont effacées.</p>
    ${dl ? '<button class="btn primary" data-r="export">Enregistrer une copie</button>' : '<p class="hint">L\'enregistrement d\'une copie n\'est pas disponible ici.</p>'}
    <label class="btn" for="imp" tabindex="0">Restaurer une copie</label>
    <button class="btn" data-r="no">Fermer</button>`);
  if (r !== 'export') return;
  try {
    const out = {v:1, folders, docs: await Promise.all(docs.map(async d => ({...d, blob:undefined, data: d.blob ? await toData(d.blob) : undefined})))};
    await dl.save({filename:'mes-papiers-' + new Date().toISOString().slice(0, 10) + '.json', data: JSON.stringify(out)});
    toast('Copie enregistrée');
  } catch (e) { if (!e || e.code !== 'declined') toast('La copie n\'a pas pu être enregistrée.'); }
}
$('#imp').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return; sheet.close(null);
  try {
    const j = JSON.parse(await f.text()); let n = 0;
    for (const x of j.folders || []) if (!folderById(x.id)) { folders.push(x); await save('folders', x); n++; }
    for (const x of j.docs || []) if (!docs.find(d => d.id === x.id)) { const d = {...x, blob: x.data ? fromData(x.data) : undefined}; delete d.data; docs.push(d); await save('docs', d); n++; }
    toast(n ? 'Copie restaurée' : 'Tout était déjà présent'); render();
  } catch (err) { toast('Ce fichier n\'est pas une copie valide.'); }
};

/* ---------- Actions ---------- */
async function purgeDoc(d) { docs = docs.filter(x => x !== d); const u = urls.get(d.id); if (u) { URL.revokeObjectURL(u); urls.delete(d.id); } await drop('docs', d.id); }
async function purgeFolder(f) { for (const d of docs.filter(x => x.folder === f.id)) await purgeDoc(d); folders = folders.filter(x => x !== f); await drop('folders', f.id); }
const setDel = (store, o, v) => { o.deleted = v; return save(store, o); };

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  const f = folderById(id), d = docs.find(x => x.id === id);
  if (a === 'home') go({n:'home'});
  else if (a === 'open' || a === 'folder') go({n:'folder', id});
  else if (a === 'doc') go({n:'doc', id});
  else if (a === 'trash') go({n:'trash'});
  else if (a === 'add') addFlow(id);
  else if (a === 'backup') backup();
  else if (a === 'all') go({n:'all'});
  else if (a === 'newnote') { sheet.close(null); noteFlow(); }
  else if (a === 'editnote') noteFlow(d);
  else if (a === 'export') exportDoc(d);
  else if (a === 'zoom') { const z = $('#viewer').classList.toggle('zoom'); b.textContent = z ? 'Réduire' : 'Agrandir'; }
  else if (a === 'undo') { const t = $('#toast'); t.hidden = true; const u = t._u; t._u = null; if (u) u(); }
  else if (a === 'newfolder') {
    const name = await askText('Nom du nouveau dossier', '', 'Créer'); if (!name) return;
    const nf = {id:uid(), name, c:folders.length % 6, created:Date.now(), deleted:0};
    folders.push(nf); await save('folders', nf); render();
  }
  else if (a === 'renamefolder') { const name = await askText('Nom du dossier', f.name); if (!name) return; f.name = name; await save('folders', f); render(); }
  else if (a === 'delfolder') {
    await setDel('folders', f, Date.now()); go({n:'home'});
    toast('Dossier mis à la corbeille', async () => { await setDel('folders', f, 0); render(); });
  }
  else if (a === 'renamedoc') { const t = await askText('Nom du document', d.title); if (!t) return; d.title = t; await save('docs', d); render(); }
  else if (a === 'movedoc') {
    const r = await sheet(`<h2>Déplacer dans quel dossier ?</h2><div class="chips">${liveFolders().map(x => `<button class="opt" data-r="${x.id}">${esc(x.name)}</button>`).join('')}</div><button class="btn" data-r="no">Annuler</button>`);
    if (!r || !folderById(r)) return; d.folder = r; await save('docs', d); toast('Document déplacé'); go({n:'doc', id:d.id});
  }
  else if (a === 'deldoc') {
    const back = d.folder; await setDel('docs', d, Date.now()); go({n:'folder', id:back});
    toast('Document mis à la corbeille', async () => { await setDel('docs', d, 0); render(); });
  }
  else if (a === 'restorefolder') { await setDel('folders', f, 0); toast('Dossier remis'); render(); }
  else if (a === 'restoredoc') { await setDel('docs', d, 0); toast('Document remis'); render(); }
  else if (a === 'purgefolder') { if (await askYes('Supprimer pour toujours ?', 'Le dossier « ' + f.name + ' » et ses documents seront effacés. Impossible de les récupérer.', 'Oui, supprimer pour toujours')) { await purgeFolder(f); render(); } }
  else if (a === 'purgedoc') { if (await askYes('Supprimer pour toujours ?', '« ' + d.title + ' » sera effacé. Impossible de le récupérer.', 'Oui, supprimer pour toujours')) { await purgeDoc(d); render(); } }
  else if (a === 'emptytrash') {
    if (await askYes('Vider la corbeille ?', 'Tout ce qui s\'y trouve sera effacé. Impossible de le récupérer.', 'Oui, tout effacer')) {
      for (const x of trashDocs()) await purgeDoc(x);
      for (const x of trashFolders()) await purgeFolder(x);
      render();
    }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { q = e.target.value; homeBody(); }
  else if (e.target.id === 'sort') { sort = e.target.value; if (view.n === 'home') homeBody(); else render(); }
});

/* ---------- Démarrage ---------- */
(async () => {
  try {
    db = await openDB(); folders = await tx('folders', 'readonly', o => o.getAll()); docs = await tx('docs', 'readonly', o => o.getAll());
    folders.sort((a, b) => a.created - b.created);
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  } catch (e) { db = null; window.__dbFailed = true; }
  if (!folders.length && !docs.length) {
    ['Médecin', 'Hôpital', 'Assurance', 'Impôts', 'Banque', 'Divers'].forEach((name, i) => folders.push({id:uid(), name, c:i, created:Date.now() + i, deleted:0}));
    for (const f of folders) await save('folders', f);
  }
  render();
  dl = {save: browserSave};
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); } catch (e) {}
  handleShare();
})();
</script>
</body>
</html>
